# TempoRun.xcodeproj — 用 XcodeGen 生成: https://github.com/yonaskolb/XcodeGen
# 生成命令: brew install xcodegen && xcodegen generate
name: TempoRun
options:
  bundleIdPrefix: com.temporun
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TempoRun:
    type: application
    platform: iOS
    sources:
      - path: TempoRun
      - path: Shared
    info:
      path: TempoRun/Info.plist
    entitlements:
      path: TempoRun/TempoRun.entitlements
    dependencies:
      - target: TempoRunWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temporun.app
        # 启动屏与场景清单在 Info.plist 中显式声明，不用 Xcode 自动生成键
        TARGETED_DEVICE_FAMILY: "1"

  TempoRunWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
    entitlements:
      path: Widgets/TempoRunWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temporun.app.widgets
        SKIP_INSTALL: NO

# Run 时使用本地 StoreKit Configuration（TempoRun.storekit），
# 模拟器/真机调试直接走本地购买流程，不连接 App Store 服务器。
schemes:
  TempoRun:
    build:
      targets:
        TempoRun: all
        TempoRunWidgets: all
    run:
      config: Debug
      storeKitConfigurationPath: TempoRun/TempoRun.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
